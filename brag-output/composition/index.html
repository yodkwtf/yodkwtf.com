<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e0e0c;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1 — Hook: dev.ts -->
      <div
        id="el-scene1"
        class="clip"
        data-composition-id="scene1-hook"
        data-composition-src="compositions/scene1-hook.html"
        data-start="0"
        data-duration="4.3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 2 — Reveal: the case study that updates itself -->
      <div
        id="el-scene2"
        class="clip"
        data-composition-id="scene2-reveal"
        data-composition-src="compositions/scene2-reveal.html"
        data-start="3.7"
        data-duration="5.34"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 3 — Highlight: reading, live -->
      <div
        id="el-scene3"
        class="clip"
        data-composition-id="scene3-reading"
        data-composition-src="compositions/scene3-reading.html"
        data-start="8.44"
        data-duration="5.86"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 4 — Highlight + outro: publishes itself -->
      <div
        id="el-scene4"
        class="clip"
        data-composition-id="scene4-outro"
        data-composition-src="compositions/scene4-outro.html"
        data-start="13.7"
        data-duration="6.3"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Music bed -->
      <audio
        id="bgm"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.28"
      ></audio>

      <!-- SFX: scene1 payoff line ("available: true") — beat-grid: 2.73s -->
      <audio
        id="sfx-hook"
        src="assets/sfx/interface/drop_001.ogg"
        data-start="2.68"
        data-duration="0.11"
        data-track-index="11"
        data-volume="0.55"
      ></audio>

      <!-- SFX: scene3 copy-button click — beat-grid: 12.02s -->
      <audio
        id="sfx-copy"
        src="assets/sfx/ui/click1.ogg"
        data-start="11.97"
        data-duration="0.09"
        data-track-index="12"
        data-volume="0.5"
      ></audio>

      <!-- SFX: scene4 newsletter send — beat-locked: 17.47s -->
      <audio
        id="sfx-send"
        src="assets/sfx/interface/bong_001.ogg"
        data-start="17.42"
        data-duration="0.12"
        data-track-index="13"
        data-volume="0.55"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Crossfade 1: scene1 -> scene2, overlap window 3.7-4.3
      tl.to("#el-scene1", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 3.7);
      tl.fromTo("#el-scene2", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.7);

      // Crossfade 2: scene2 -> scene3, overlap window 8.44-9.04 — beat-locked: 8.74s (strong cue)
      tl.to("#el-scene2", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 8.44);
      tl.fromTo("#el-scene3", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 8.44);

      // Crossfade 3: scene3 -> scene4, overlap window 13.7-14.3
      tl.to("#el-scene3", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 13.7);
      tl.fromTo("#el-scene4", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 13.7);

      // Music arc: fade in, hold low, swell into the outro, fade out on the final hold
      tl.fromTo("#bgm", { volume: 0 }, { volume: 0.28, duration: 1.0, ease: "power1.out" }, 0);
      tl.to("#bgm", { volume: 0.35, duration: 0.8, ease: "sine.inOut" }, 17.6);
      tl.to("#bgm", { volume: 0, duration: 1.5, ease: "power1.in" }, 18.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
