        .s4-connector { width: 50px; height: 2px; background: rgba(240, 239, 233, 0.14); flex-shrink: 0; position: relative; }
        .s4-connector::after {
          content: ""; position: absolute; right: -2px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px;

        .s4-pill { display: inline-flex; align-items: center; gap: 8px; font-family: "DM Mono", monospace; font-size: 19px; padding: 8px 18px; border-radius: 999px; border: 1px solid #2a2a26; color: #a3a39a; margin-top: auto; align-self: flex-start; }

        /* Phase B — brand outro */

        .s4-corner.tl { left: 64px; top: 96px; border-top: 2px solid; border-left: 2px solid; border-top-left-radius: 8px; }
        .s4-corner.tr { right: 64px; top: 96px; border-top: 2px solid; border-right: 2px solid; border-top-right-radius: 8px; }
        .s4-corner.bl { left: 64px; bottom: 64px; border-bottom: 2px solid; border-left: 2px solid; border-bottom-left-radius: 8px; }

                <span class="s4-tag-new" style="margin-left:auto;">NEW</span>

          <div class="s4-corner br"></div>

      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        tl.fromTo("#seg4", { scaleX: 0 }, { scaleX: 1, duration: 6.3, ease: "none" }, 0);

        tl.fromTo("#s4-strip-header", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
        tl.fromTo("#s4-chip1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.5);
        tl.fromTo("#s4-chip2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.0);
        tl.fromTo("#s4-chip3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.8);
        tl.fromTo("#s4-strip-caption", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.1);

        // chip1: scheduled -> published
        tl.to("#s4-status-pill", { opacity: 0, duration: 0.15 }, 1.3);
        tl.call(function () {
          document.getElementById("s4-status-pill").textContent = "Published";
          document.getElementById("s4-status-pill").classList.add("live");
        }, [], 1.45);
        tl.to("#s4-status-pill", { opacity: 1, duration: 0.15 }, 1.45);

        // envelope sends — beat-locked to strong cue 17.47s global == 3.77s local
        var SEND_T = 3.77; // beat-locked: 17.47s
        tl.to("#s4-envelope", { scale: 1.25, duration: 0.14, ease: "power2.out" }, SEND_T);
        tl.to("#s4-envelope", { scale: 1, duration: 0.22, ease: "power2.inOut" }, SEND_T + 0.14);
        tl.to("#s4-mail-status", { opacity: 0, duration: 0.12 }, SEND_T);
        tl.call(function () {
          document.getElementById("s4-mail-status").textContent = "Sent";
          document.getElementById("s4-mail-status").style.color = "#34d399";
        }, [], SEND_T + 0.12);
        tl.to("#s4-mail-status", { opacity: 1, duration: 0.2 }, SEND_T + 0.12);
        tl.to("#s4-mail-pill", { opacity: 0, duration: 0.12 }, SEND_T);
        tl.call(function () {
          var p = document.getElementById("s4-mail-pill");
          p.textContent = "Delivered";
          p.classList.add("live");
        }, [], SEND_T + 0.12);
        tl.to("#s4-mail-pill", { opacity: 1, duration: 0.2 }, SEND_T + 0.12);

        // internal phase crossfade: strip out, brand outro in (exit allowed — final scene)
        var PT = 3.95;
        tl.to("#s4-phaseA", { opacity: 0, y: -18, duration: 0.4, ease: "power2.in" }, PT);
        tl.fromTo("#s4-phaseB", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, PT + 0.1);
        tl.fromTo("#s4-glow-outro", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, PT + 0.1);

        tl.fromTo("#s4-tagline", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.3);

        // subtle accent pulse on the outro glow — beat-locked to strong cue 18.56s global == 4.86s local
        var PULSE_T = 4.86; // beat-locked: 18.56s
        tl.to("#s4-glow-outro", { opacity: 1, scale: 1.06, duration: 0.3, ease: "sine.out" }, PULSE_T);
        tl.to("#s4-glow-outro", { opacity: 0.85, scale: 1, duration: 0.5, ease: "sine.inOut" }, PULSE_T + 0.3);

        tl.fromTo("#s4-wordmark", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.3);
        tl.fromTo("#s4-socials", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.6);

        // keep the outro glow gently breathing through the final hold
        tl.to("#s4-glow-outro", { scale: 1.04, duration: 0.4, ease: "sine.inOut" }, 5.9);

        window.__timelines["scene4-outro"] = tl;
      </script>
